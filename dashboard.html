<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - CarePlus Clinic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef8f8;
            color: #263238;
        }

        .page {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        header {
            background: #087f8c;
            color: white;
            padding: 25px 35px;
            border-radius: 15px 15px 0 0;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: white;
            color: #087f8c;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        h1 {
            margin: 0;
        }

        .brand p {
            margin: 5px 0;
        }

        .step {
            background: white;
            color: #087f8c;

            padding: 10px 18px;

            border-radius: 20px;

            font-weight: bold;
        }

        /* PROGRESS */

        .progress {
            background: white;

            padding: 20px;

            display: flex;
            justify-content: space-around;

            border-bottom: 1px solid #ddd;
        }

        .progress-item {
            text-align: center;
            color: #aaa;
            font-weight: bold;
        }

        .progress-item span {
            display: block;

            width: 30px;
            height: 30px;

            margin: auto;

            border-radius: 50%;

            background: #ddd;

            padding-top: 6px;
        }

        .progress-item.completed,
        .progress-item.active {
            color: #087f8c;
        }

        .progress-item.completed span,
        .progress-item.active span {
            background: #087f8c;
            color: white;
        }

        /* SUCCESS */

        .success {
            background: #dff6e5;

            color: #237a3b;

            padding: 22px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;
        }

        /* CARD */

        .card {
            background: white;

            padding: 40px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .card h2 {
            color: #174a5b;

            margin-top: 0;
        }

        .details {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-top: 25px;
        }

        .detail-box {
            background: #f5fafb;

            padding: 20px;

            border-radius: 10px;

            border-left: 4px solid #087f8c;
        }

        .detail-box span {
            display: block;

            color: #777;

            margin-bottom: 8px;
        }

        .detail-box strong {
            color: #174a5b;

            font-size: 17px;
        }

        .paid {
            color: green !important;
        }

        /* BUTTON */

        .actions {
            text-align: center;

            margin-top: 35px;
        }

        button {
            padding: 14px 30px;

            background: #087f8c;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #05636d;
        }

        footer {
            text-align: center;

            padding: 20px;

            color: #777;
        }

        @media(max-width:700px) {

            .details {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- HEADER -->

    <header>

        <div class="brand">

            <div class="logo">
                ⚕
            </div>

            <div>

                <h1>CarePlus Clinic</h1>

                <p>Appointment Dashboard</p>

            </div>

        </div>


        <div class="step">
            Step 5 of 5
        </div>

    </header>



    <!-- PROGRESS -->

    <div class="progress">

        <div class="progress-item completed">
            <span>✓</span>
            Patient
        </div>

        <div class="progress-item completed">
            <span>✓</span>
            Doctor
        </div>

        <div class="progress-item completed">
            <span>✓</span>
            Appointment
        </div>

        <div class="progress-item completed">
            <span>✓</span>
            Payment
        </div>

        <div class="progress-item active">
            <span>5</span>
            Dashboard
        </div>

    </div>



    <!-- SUCCESS MESSAGE -->

    <div class="success">

        ✓ Appointment Confirmed Successfully!

    </div>



    <!-- DASHBOARD -->

    <main class="card">

        <h2>
            Appointment Details
        </h2>


        <div class="details">


            <div class="detail-box">

                <span>Doctor</span>

                <strong id="doctor">
                    -
                </strong>

            </div>


            <div class="detail-box">

                <span>Specialization</span>

                <strong id="specialization">
                    -
                </strong>

            </div>


            <div class="detail-box">

                <span>Appointment Date</span>

                <strong id="date">
                    -
                </strong>

            </div>


            <div class="detail-box">

                <span>Appointment Time</span>

                <strong id="time">
                    -
                </strong>

            </div>


            <div class="detail-box">

                <span>Consultation Fee</span>

                <strong>
                    ₹<span id="fee">0</span>
                </strong>

            </div>


            <div class="detail-box">

                <span>Payment Status</span>

                <strong class="paid" id="status">
                    Paid
                </strong>

            </div>


        </div>


        <!-- BACK TO LOGIN -->

        <div class="actions">

            <button onclick="goToLogin()">
                Back to Login
            </button>

        </div>

    </main>



    <footer>

        © 2026 CarePlus Clinic

    </footer>


</div>



<script>

    // GET SAVED DETAILS

    document.getElementById("doctor").innerText =
        localStorage.getItem("doctorName") || "-";


    document.getElementById("specialization").innerText =
        localStorage.getItem("specialization") || "-";


    document.getElementById("date").innerText =
        localStorage.getItem("appointmentDate") || "-";


    document.getElementById("time").innerText =
        localStorage.getItem("appointmentTime") || "-";


    document.getElementById("fee").innerText =
        localStorage.getItem("fee") || "0";


    document.getElementById("status").innerText =
        localStorage.getItem("paymentStatus") || "Paid";



    // BACK TO LOGIN

    function goToLogin() {
    window.location.href = "./index.html";
}
    

</script>


</body>

</html>
